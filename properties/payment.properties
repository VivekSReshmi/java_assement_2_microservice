spring.application.name=payment
eureka.instance.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
server.port:8082
resilience4j.circuitbreaker.instances.shopping.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.shopping.failureRateThreshold=5
resilience4j.circuitbreaker.instances.shopping.minimumNumberOfCalls=1
resilience4j.circuitbreaker.instances.shopping.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.shopping.waitDurationInOpenState=5s
resilience4j.circuitbreaker.instances.shopping.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.shopping.slidingWindowSize=10
resilience4j.circuitbreaker.instances.shopping.slidingWindowType=COUNT_BASED
management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=health
management.health.circuitbreakers.enabled=true

spring.datasource.url=jdbc:mysql://localhost:3306/payment_db
spring.datasource.username=root
spring.datasource.password=Vivek
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
